# Tests run against a SEPARATE MySQL database so they never touch your real data.
# Create it once:  CREATE DATABASE gameflix_test;  and grant the same user access.
# Credentials still come from MYSQL_USER / MYSQL_PASSWORD (env vars); the JWT secret is generated per run in the test class.
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/gameflix_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.jpa.hibernate.ddl-auto=update
