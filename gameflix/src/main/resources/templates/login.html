<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GameFlix</title>
</head>
<body>
<h1>GameFlix</h1>
<hr>
<h2>Log in</h2>
<p th:if="${registered}" style="color:green">Account created. Please log in.</p>
<p th:if="${error}" th:text="${error}" style="color:red"></p>
<form th:action="@{/login}" method="post">
    <p><label>Email <input type="email" name="email" th:value="${email}"></label></p>
    <p><label>Password <input type="password" name="password"></label></p>
    <button type="submit">Log in</button>
</form>
<p><a th:href="@{/register}">Need an account? Register</a> | <a th:href="@{/}">Home</a></p>
</body>
</html>
