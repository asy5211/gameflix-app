<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body>
<header th:replace="~{fragments :: navGuest}"></header>
<main class="wrap">
    <div class="box narrow">
        <h2>Log in</h2>
        <p class="ok" th:if="${registered}">Account created. Please log in.</p>
        <p class="error" th:if="${error}" th:text="${error}"></p>
        <form th:action="@{/login}" method="post">
            <label>Email
                <input type="email" name="email" th:value="${email}">
            </label>
            <label>Password
                <input type="password" name="password">
            </label>
            <button class="btn dark" type="submit">Log in</button>
        </form>
        <p style="margin-top:16px"><a th:href="@{/register}">Need an account? Register</a></p>
    </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
