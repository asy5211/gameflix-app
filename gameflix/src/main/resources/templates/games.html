<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body>
<header th:replace="~{fragments :: navUser}"></header>
<main class="wrap">
    <h2>Game catalog</h2>
    <div class="box">
        <form class="searchbar" th:action="@{/games}" method="get">
            <input type="text" name="q" th:value="${q}" placeholder="Search games by title">
            <button class="btn dark" type="submit">Search</button>
            <a class="btn" th:if="${q != null and !q.isEmpty()}" th:href="@{/games}">Clear</a>
        </form>
    </div>
    <p th:text="${games.size()} + ' game(s) found'"></p>
    <p class="box" th:if="${games.isEmpty()}">No games match your search.</p>
    <div class="grid" th:unless="${games.isEmpty()}">
        <div class="card" th:each="g : ${games}">
            <div class="ph ph-card"><span>Game art</span></div>
            <h3><a th:href="@{/games/{id}(id=${g.id})}" th:text="${g.title}"></a></h3>
            <p class="meta">
                <span class="chip" th:text="${g.genre.name}"></span>
                <span class="chip" th:text="${g.releaseYear}"></span>
            </p>
            <a class="btn" th:href="@{/games/{id}(id=${g.id})}">View</a>
        </div>
    </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
