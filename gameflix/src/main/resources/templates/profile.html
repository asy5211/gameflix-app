<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GameFlix</title>
</head>
<body>
<h1>GameFlix</h1>
<p>
    <a th:href="@{/}">Home</a> |
    <a th:href="@{/games}">Games</a> |
    <a th:href="@{/profile}">My profile</a>
</p>
<hr>
<h2>My profile</h2>
<table border="1" cellpadding="4">
    <tr><th>ID</th><td th:text="${user.id()}"></td></tr>
    <tr><th>Display name</th><td th:text="${user.displayName()}"></td></tr>
    <tr><th>Email</th><td th:text="${user.email()}"></td></tr>
    <tr><th>Member since</th><td th:text="${user.createdAt()}"></td></tr>
</table>
<h3>My favorite games</h3>
<p th:if="${favorites.isEmpty()}">You have no favorites yet. <a th:href="@{/games}">Browse the catalog</a>.</p>
<ul th:unless="${favorites.isEmpty()}">
    <li th:each="g : ${favorites}">
        <a th:href="@{/games/{id}(id=${g.id})}" th:text="${g.title}"></a>
        (<span th:text="${g.genre.name}"></span>)
    </li>
</ul>
<form th:action="@{/logout}" method="post"><button type="submit">Log out</button></form>
</body>
</html>
