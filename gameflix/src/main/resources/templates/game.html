<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body>
<header th:replace="~{fragments :: navUser}"></header>
<main class="wrap">
    <p><a th:href="@{/games}">&larr; Back to catalog</a></p>
    <div class="cols">
        <div class="ph ph-detail"><span>Game art</span></div>
        <div class="box">
            <h2 th:text="${game.title}"></h2>
            <p>
                <span class="chip" th:text="${game.genre.name}"></span>
                <span class="chip" th:text="${game.releaseYear}"></span>
            </p>
            <p th:text="${game.description}"></p>

            <div th:if="${canPlay}">
                <a class="btn dark" th:href="@{/games/{id}/play(id=${game.id})}">Play now</a>
            </div>
            <div th:unless="${canPlay}" class="box dashed">
                <p>Playing requires an active subscription.</p>
                <a class="btn" th:href="@{/subscription}">Subscribe to play</a>
            </div>

            <form th:if="${!favorite}" th:action="@{/games/{id}/favorite(id=${game.id})}" method="post">
                <button class="btn" type="submit">Add to favorites</button>
            </form>
            <form th:if="${favorite}" th:action="@{/games/{id}/unfavorite(id=${game.id})}" method="post">
                <p class="note">This game is in your favorites.</p>
                <button class="btn" type="submit">Remove from favorites</button>
            </form>
        </div>
    </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
