<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GameFlix</title>
</head>
<body>
<h1>GameFlix</h1>
<hr>
<h2>Register</h2>
<ul th:if="${errors != null and !errors.isEmpty()}" style="color:red">
    <li th:each="e : ${errors}" th:text="${e}"></li>
</ul>
<form th:action="@{/register}" method="post">
    <p><label>Email <input type="email" name="email" th:value="${email}"></label></p>
    <p><label>Display name <input type="text" name="displayName" th:value="${displayName}"></label></p>
    <p><label>Password (8-64 characters) <input type="password" name="password"></label></p>
    <button type="submit">Register</button>
</form>
<p><a th:href="@{/login}">Already have an account? Log in</a> | <a th:href="@{/}">Home</a></p>
</body>
</html>
