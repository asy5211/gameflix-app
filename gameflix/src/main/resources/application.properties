spring.application.name=gameflix

# Secrets (DB credentials, JWT secret) are NOT in this file.
# They come from environment variables or from the untracked application-local.properties.
spring.config.import=optional:classpath:application-local.properties

# --- MySQL / JPA ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gameflix?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# update: creates/adjusts the table on startup and keeps data between runs
# (create-drop would wipe users on every restart and destroy test evidence).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- JWT ---
# Base64-encoded key, at least 32 bytes decoded (256 bits) for HS256. Supplied via env/local file only.
app.jwt.secret=${JWT_SECRET}
# 30 minutes
app.jwt.expiration-minutes=30
app.jwt.issuer=gameflix

# --- CORS: front-end origin only, never * ---
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

# --- Password hashing ---
# bcrypt work factor (cost). 2^12 iterations.
app.security.bcrypt-strength=12

# Never log request bodies / credentials
logging.level.org.springframework.security=WARN
