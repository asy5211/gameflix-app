name: GameFlix CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# The Spring Boot project lives in the gameflix/ folder of this repository.
defaults:
  run:
    working-directory: gameflix

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest

    # Throwaway MySQL used only by the automated tests (the same role your local gameflix_test database plays).
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: gameflix_test
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: gameflix/pom.xml

      # Compiles, runs AuthFlowTest (9 tests) against the MySQL service, and packages the JAR.
      - name: Run tests and build with Maven
        run: mvn -B clean verify
        env:
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci_password
          TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/gameflix_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: gameflix/target/surefire-reports/
          if-no-files-found: ignore

  docker-and-scan:
    name: Docker image and security scan
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t gameflix-backend:ci .

      # SBOM: inventory of everything inside the built image (OS packages + every JAR in the app), in CycloneDX JSON.
      # Runs right after the build and before the scans, so the SBOM is saved as evidence even if a later gate fails.
      - name: Generate SBOM (CycloneDX) with Syft
        uses: anchore/sbom-action@v0
        with:
          image: gameflix-backend:ci
          format: cyclonedx-json
          output-file: gameflix-sbom.cdx.json
          artifact-name: gameflix-sbom.cdx.json
          upload-artifact: true

      # Security scan 1: report HIGH and CRITICAL vulnerabilities (does not fail the build).
      - name: Trivy scan - report
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: gameflix-backend:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'

      # Security scan 2 (gate): fail the build on ANY CRITICAL finding, including ones with no fix yet.
      - name: Trivy scan - fail on CRITICAL
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: gameflix-backend:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: '1'
